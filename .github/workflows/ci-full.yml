name: CI full

# Applying the ci-full label to a pull request runs the full conformance lanes for it, e.g. for
# the top PR of a stack. This is a separate workflow so that labelling never re-runs the check
# job of ci.yml. Later pushes to a labelled PR run both lanes through ci.yml itself.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    name: Git/jj conformance (${{ matrix.lane }})
    if: github.event.label.name == 'ci-full'
    strategy:
      fail-fast: false
      matrix:
        lane: [minimum, current]
    uses: ./.github/workflows/conformance.yml
    with:
      lane: ${{ matrix.lane }}
