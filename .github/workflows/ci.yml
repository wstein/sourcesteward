name: CI

on:
  # Branch pushes are covered by the pull_request run; push runs only on the default
  # branch (the Pages deploy and the post-merge check).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # True when the conformance shards run for this event (same expression as the conformance
  # job's if:); the check job then leaves internal/workspace to the shards. When false, check
  # tests it plain (no -race).
  CONFORMANCE_TIER: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref == github.event.repository.default_branch || contains(github.event.pull_request.labels.*.name, 'ci-full') }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes its running checks; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the change set (scripts/ci_changes.py). docs_only is true only for a pull_request
  # whose every changed file is documentation prose; it lets conformance skip its shards.
  # affected lists the changed Go packages plus their reverse dependencies (T1, Spec 039) and
  # affected_reason is docs-only, packages or all (fail closed: all). No path filter is used,
  # so every check still reports a status.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      affected: ${{ steps.affected.outputs.affected }}
      affected_reason: ${{ steps.affected.outputs.affected_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # No cache here: this job finishes first and would save a near-empty cache under the key
      # of the check and shard jobs, which then could not save their full one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Detect documentation-only pull requests
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -B scripts/ci_changes.py >> "$GITHUB_OUTPUT"
      - name: Select the affected Go packages
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python3 -B scripts/ci_changes.py affected >> "$GITHUB_OUTPUT"

  check:
    needs: [changes]
    # Runs even when the classifier job failed: its empty outputs mean every package is tested.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STW_REQUIRE_NATIVE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install checked Hugo release
        run: python3 -B scripts/install-hugo.py
      - name: Install distro sandbox without relaxing host protections
        if: needs.changes.outputs.affected_reason != 'docs-only'
        run: |
          sandbox_settings() {
            for setting in kernel/unprivileged_userns_clone kernel/apparmor_restrict_unprivileged_userns user/max_user_namespaces; do
              if test -f "/proc/sys/$setting"; then cat "/proc/sys/$setting"; else echo unavailable; fi
            done
          }
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then
            test "$(cat /proc/sys/kernel/unprivileged_userns_clone)" = 1
          fi
          before="$(sandbox_settings)"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor apparmor-profiles
          python3 -B scripts/activate-sandbox-profile.py
          test "$before" = "$(sandbox_settings)"
      - name: Require sandbox capability before source checks
        if: needs.changes.outputs.affected_reason != 'docs-only'
        run: python3 -B scripts/smoke-jj-inspection.py --sandbox-preflight
      - name: Read-only sandbox failure diagnostics
        if: failure() && needs.changes.outputs.affected_reason != 'docs-only'
        run: python3 -B scripts/smoke-jj-inspection.py --sandbox-diagnostics
      - name: Source and documentation checks
        run: make check-static
      - name: Module files must be tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Workspace test shards cover every test exactly once
        run: python3 -B scripts/ci_shards.py check --shards 4
      - name: Go tests
        env:
          AFFECTED: ${{ needs.changes.outputs.affected }}
          AFFECTED_REASON: ${{ needs.changes.outputs.affected_reason }}
        run: |
          if [ "$AFFECTED_REASON" = docs-only ]; then
            echo 'Documentation-only change: no Go tests' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fail closed: only a non-empty list with reason packages narrows the run.
          packages='./...'
          if [ "$AFFECTED_REASON" = packages ] && [ -n "$AFFECTED" ]; then
            packages="$AFFECTED"
          fi
          if [ "$CONFORMANCE_TIER" = true ]; then
            # internal/workspace runs in the conformance shards of both lanes.
            if [ "$packages" = './...' ]; then
              packages="$(python3 -B scripts/ci_shards.py packages)"
              set -- $packages
              test "$#" -gt 1
            else
              packages="$(python3 -B scripts/ci_shards.py packages --within "$packages")"
            fi
          fi
          set -- $packages
          if [ "$#" -eq 0 ]; then
            echo 'Only internal/workspace is affected: the conformance shards run it' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Go tests ($AFFECTED_REASON): $*" >> "$GITHUB_STEP_SUMMARY"
          go test -timeout 40m "$@"
      - name: Check import boundaries
        run: python3 -B scripts/check-architecture.py
      - name: Build and validate exact checked Pages artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -B scripts/package-pages.py /tmp/sourcesteward-pages "$SOURCE_SHA"
          python3 -B scripts/check-site.py /tmp/sourcesteward-pages "$SOURCE_SHA"
          echo "Pages source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: /tmp/sourcesteward-pages

  # Tiered: main pushes and PRs against the default branch run it; a PR stacked on another
  # PR branch runs it only with the ci-full label (applied later, ci-full.yml runs it). A
  # skipped job is neutral. Pull requests run only the current lane; the minimum lane gates
  # main after the merge, and runs for the ci-full label (ci-full.yml) and the race schedule.
  conformance:
    name: Git/jj conformance (${{ matrix.lane }})
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == github.event.repository.default_branch || contains(github.event.pull_request.labels.*.name, 'ci-full')
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(github.event_name == 'pull_request' && '["current"]' || '["minimum","current"]') }}
    needs: [changes]
    uses: ./.github/workflows/conformance.yml
    with:
      lane: ${{ matrix.lane }}
      docs_only: ${{ needs.changes.outputs.docs_only }}

  pages:
    needs: [check, conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Consume the identical artifact built and checked by the prerequisite job.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy checked source
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
