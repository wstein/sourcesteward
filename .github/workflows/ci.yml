name: CI

on:
  # Branch pushes are covered by the pull_request run; push runs only on the default
  # branch (the Pages deploy and the post-merge check).
  push:
    branches: [main]
  pull_request:
    # labeled: adding ci-full to a PR starts the full conformance run.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STW_REQUIRE_NATIVE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install checked Hugo release
        run: python3 -B scripts/install-hugo.py
      - name: Install distro sandbox without relaxing host protections
        run: |
          sandbox_settings() {
            for setting in kernel/unprivileged_userns_clone kernel/apparmor_restrict_unprivileged_userns user/max_user_namespaces; do
              if test -f "/proc/sys/$setting"; then cat "/proc/sys/$setting"; else echo unavailable; fi
            done
          }
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then
            test "$(cat /proc/sys/kernel/unprivileged_userns_clone)" = 1
          fi
          before="$(sandbox_settings)"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor apparmor-profiles
          python3 -B scripts/activate-sandbox-profile.py
          test "$before" = "$(sandbox_settings)"
      - name: Require sandbox capability before source checks
        run: python3 -B scripts/smoke-jj-inspection.py --sandbox-preflight
      - name: Read-only sandbox failure diagnostics
        if: failure()
        run: python3 -B scripts/smoke-jj-inspection.py --sandbox-diagnostics
      - name: Source and documentation checks
        run: make check-static
      - name: Module files must be tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Race tests
        run: go test -timeout 40m -race ./...
      - name: Check import boundaries
        run: python3 -B scripts/check-architecture.py
      - name: Build and validate exact checked Pages artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -B scripts/package-pages.py /tmp/sourcesteward-pages "$SOURCE_SHA"
          python3 -B scripts/check-site.py /tmp/sourcesteward-pages "$SOURCE_SHA"
          echo "Pages source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: /tmp/sourcesteward-pages

  conformance:
    name: Git/jj conformance (${{ matrix.lane }})
    # Tiered: main pushes and PRs against the default branch run it; a PR stacked on another
    # PR branch runs it only with the ci-full label. A skipped job is neutral.
    if: github.event_name != 'pull_request' || github.event.pull_request.base.ref == github.event.repository.default_branch || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        lane: [minimum, current]
    env:
      STW_REQUIRE_JJ: '1'
      STW_REQUIRE_NATIVE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install distro sandbox without relaxing host protections
        run: |
          sandbox_settings() {
            for setting in kernel/unprivileged_userns_clone kernel/apparmor_restrict_unprivileged_userns user/max_user_namespaces; do
              if test -f "/proc/sys/$setting"; then cat "/proc/sys/$setting"; else echo unavailable; fi
            done
          }
          if test -f /proc/sys/kernel/unprivileged_userns_clone; then
            test "$(cat /proc/sys/kernel/unprivileged_userns_clone)" = 1
          fi
          before="$(sandbox_settings)"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap apparmor apparmor-profiles
          python3 -B scripts/activate-sandbox-profile.py
          test "$before" = "$(sandbox_settings)"
      - name: Require sandbox capability before building toolchains
        run: python3 -B scripts/smoke-jj-inspection.py --sandbox-preflight
      - name: Read-only sandbox failure diagnostics
        if: failure()
        run: python3 -B scripts/smoke-jj-inspection.py --sandbox-diagnostics
      - name: Resolve pinned Git version for the build cache key
        id: gitpin
        env:
          BACKEND_LANE: ${{ matrix.lane }}
        run: |
          python3 -B -c "import json, os; print('version=' + json.load(open('scripts/backend-releases.json'))[os.environ['BACKEND_LANE']]['git']['version'])" >> "$GITHUB_OUTPUT"
      # Only the Git build prefix is cached (jj is a checked download). The Git version is
      # asserted again by the preflight below, so a stale or wrong cache entry fails closed.
      - name: Restore cached Git build
        id: gitcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/conformance/${{ matrix.lane }}/git
          key: stw-git-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ steps.gitpin.outputs.version }}-${{ hashFiles('scripts/install-backends.py') }}
      - name: Install checked native backend releases
        env:
          BACKEND_LANE: ${{ matrix.lane }}
          GIT_CACHE_HIT: ${{ steps.gitcache.outputs.cache-hit }}
        run: |
          if [ "$GIT_CACHE_HIT" = true ]; then
            python3 -B scripts/install-backends.py --tool jj "$BACKEND_LANE"
          else
            python3 -B scripts/install-backends.py "$BACKEND_LANE"
          fi
          echo "$GITHUB_WORKSPACE/.tools/conformance/$BACKEND_LANE/git/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.tools/conformance/$BACKEND_LANE/jj" >> "$GITHUB_PATH"
      - name: Install checked GitHub CLI for private extension conformance
        run: |
          python3 -B scripts/install-hosting-gh.py
          echo "$GITHUB_WORKSPACE/.tools/hosting-gh/bin" >> "$GITHUB_PATH"
      - name: Assert exact versions and required sandbox capability
        env:
          BACKEND_LANE: ${{ matrix.lane }}
        run: python3 -B scripts/smoke-jj-inspection.py --preflight "$BACKEND_LANE"
      - name: Mandatory real-backend and schema conformance with race checks
        run: go test -count=1 -timeout 40m -race ./...
      - name: Real CLI inspection and zero-write acceptance
        run: |
          go build -o bin/stw ./cmd/stw
          python3 -B scripts/smoke-inspection.py
          python3 -B scripts/smoke-jj-inspection.py
          python3 -B scripts/smoke-inventory.py
          python3 -B scripts/smoke-repos.py
          python3 -B scripts/smoke-workspaces.py
          python3 -B scripts/smoke-tidy.py
          python3 -B scripts/smoke-tidy-apply.py
          python3 -B scripts/smoke-retirement.py
          go build -o bin/gh-jj/gh-jj ./cmd/gh-jj
          python3 -B scripts/smoke-hosting.py

  pages:
    needs: [check, conformance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Consume the identical artifact built and checked by the prerequisite job.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy checked source
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
