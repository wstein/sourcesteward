[package]
name = "stw"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
description = "SourceSteward: everyday git and GitHub workflows for agents, on gitoxide, without git or gh binaries"
license = "EUPL-1.2"
publish = false

[[bin]]
name = "stw"
path = "src/main.rs"

[dependencies]
tempfile = "3"
# derive only; no color, no env/unicode/wrap_help extras (binary size)
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Pinned exactly: gix has no API stability promise before 1.0.
gix = { version = "=0.90.0", default-features = false, features = [
    "sha1", "parallel", "blob-diff", "merge", "revision", "index", "status", "dirwalk",
    "worktree-mutation", "attributes", "excludes",
    "blocking-network-client", "blocking-http-transport-reqwest-rust-tls",
] }
# Pinned exactly (owner decision D-20261119-04): the watch core writes its own state and journal formats with them.
# Both are already in the lock file through gix and ureq; serde adds only the derive feature on top.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "raw_value"] }
# Blocking, no async runtime; GitHub needs five GET endpoints only.
ureq = { version = "3", features = ["json", "platform-verifier"] }
base64 = "0.22"
# kill(2) on the process group of a timed-out git (std has no group kill); already in the lock file via gix/ureq.
libc = "0.2"

[target.'cfg(unix)'.dependencies]
# Descriptor-relative worktree reads without following symlinks.
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Line tables only: backtraces keep file:line; smaller objects and linker input (less RAM, disk and time for the test binaries).
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
# Exact pins; dev-only; normal graph unchanged.
proptest = "=1.12.0"
insta = { version = "=1.49.0", features = ["filters"] }
datatest-stable = "=0.3.3"

[[test]]
name = "slug_cases"
harness = false

[[test]]
name = "review_states"
harness = false
