# Worked example 3: a polyglot project (Go CLI, Elixir release, Python tool, image); several builds and artifacts.
schema_version = 1

[project]
name = "WorkHarbor"

[version]
scheme = "semver"
source = "file"
file = "web/mix.exs"
file_pattern = '(?m)^\s*version: "([0-9]+\.[0-9]+\.[0-9]+)"'
file_form = "without-v"

[[build]]
id = "whr"
scope = "per-target"
argv = ["sh", "scripts/release/cli.sh", "{os}", "{arch}", "{version_number}", "{output}"]
env_set = ["CGO_ENABLED=0", "GOOS={os}", "GOARCH={arch}"]

[[build]]
id = "web"
scope = "once"
argv = ["sh", "scripts/release/web.sh", "{version_number}", "{out_dir}"]
env_set = ["MIX_ENV=prod"]
working_dir = "."
timeout_seconds = 2400

[[build]]
id = "tools"
scope = "once"
argv = ["python3", "scripts/release/pack_tools.py", "{version_number}", "{out_dir}"]

[[build]]
id = "web-image"
scope = "once"
argv = ["sh", "scripts/release/image.sh", "{commit12}", "{out_dir}/web-image-result.json"]

[[target]]
id = "whr-linux-amd64"
kind = "file"
group = "cli"
build = "whr"
os = "linux"
arch = "amd64"
output = "dist/release/whr_{version_number}_linux_amd64.tar.gz"

[[target]]
id = "whr-darwin-arm64"
kind = "file"
group = "cli"
build = "whr"
os = "darwin"
arch = "arm64"
output = "dist/release/whr_{version_number}_darwin_arm64.tar.gz"

[[target]]
id = "web-linux-amd64"
kind = "file"
group = "web"
build = "web"
os = "linux"
arch = "amd64"
output = "dist/release/workharbor-web_{version_number}_linux_amd64.tar.gz"

[[target]]
id = "tools"
kind = "file"
group = "tools"
build = "tools"
os = "any"
arch = "any"
output = "dist/release/workharbor-tools_{version_number}.pyz"

[[target]]
id = "web-image"
kind = "oci-image"
group = "web"
build = "web-image"
repository = "ghcr.io/wstein/workharbor-web"
platforms = ["linux/amd64"]
staging_tag = "staging-{commit12}"
result_file = "dist/release/web-image-result.json"

[promote]
argv = ["crane", "tag", "{repository}@{digest}", "{version}"]

[outputs]
checksums = "SHA256SUMS"

[reproducibility]
policy = "best-effort"
source_date_epoch = "commit-time"

[allowlist]
paths = ["docs/**", "CHANGELOG.md"]

[ci]
workflows = ["ci.yml"]
release_workflow = ".github/workflows/release-build.yml"
