# Worked example 2 (file .stw/release.toolbox.toml; BundleDock also has a CLI product): an OCI bundle with calendar versions.
# Decision D10 preconditions: P1 restartable counter (non-decreasing, counter outside order), P2 registry login is a
# workflow-owned step (no credential in this file), P3 promote adds only the version tag (no stable/latest alias).
# Promote adds the version tag to the same digest.
schema_version = 1

[project]
name = "BundleDock toolbox"
product = "toolbox"

[version]
scheme = "pattern"
source = "input"
# P1 of decision D10: the build counter (-bN.M) is outside "order" and may restart within a day.
monotonicity = "non-decreasing"
tag_template = "toolbox/{version}"
tag_pattern = '^toolbox/(?P<version>(?P<year>[0-9]{4})\.(?P<month>[0-9]{2})\.(?P<day>[0-9]{2})(?:-b(?P<build>[0-9]{1,9})(?:\.(?P<patch>[0-9]{1,9}))?)?)$'
order = ["year", "month", "day"]

[[build]]
id = "toolbox-image"
scope = "once"
argv = ["sh", "scripts/build-bundle.sh", "toolbox", "{commit12}", "{out_dir}/toolbox-result.json"]
env_inherit = ["PATH", "HOME", "TMPDIR", "DOCKER_HOST"]
timeout_seconds = 3600

[[target]]
id = "toolbox"
kind = "oci-image"
group = "bundle"
build = "toolbox-image"
repository = "ghcr.io/wstein/bundledock-toolbox"
platforms = ["linux/amd64", "linux/arm64"]
staging_tag = "staging-{commit12}"
result_file = "dist/release/toolbox-result.json"
lock_file = "bundles/toolbox/tools.lock.json"
tool_list_file = "bundles/toolbox/tools.json"
source_offer = "docs/source-offer.md"

[promote]
argv = ["crane", "tag", "{repository}@{digest}", "{version}"]

[outputs]
checksums = "SHA256SUMS"

[reproducibility]
policy = "best-effort"
source_date_epoch = "commit-time"

[allowlist]
paths = ["docs/**"]

[ci]
workflows = ["ci.yml"]
release_workflow = ".github/workflows/release-bundle.yml"
