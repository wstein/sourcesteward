# Worked example 1: a Go CLI released with the own-script adapter, three targets.
schema_version = 1

[project]
name = "SourceSteward"

[version]
scheme = "semver"
source = "input"

[[build]]
id = "cli"
scope = "per-target"
argv = ["sh", "scripts/release-package.sh", "{os}", "{arch}", "{version}", "{output}"]
env_set = ["CGO_ENABLED=0", "GOOS={os}", "GOARCH={arch}", "GOTOOLCHAIN=local", "GOFLAGS=-mod=readonly", "STW_RELEASE_VERSION={version}"]
timeout_seconds = 900

[[target]]
id = "linux-amd64"
kind = "file"
group = "cli"
build = "cli"
os = "linux"
arch = "amd64"
output = "dist/release/stw_{version_number}_linux_amd64.tar.gz"
runner = "ubuntu-24.04"
smoke_argv = ["sh", "scripts/release-smoke.sh", "{version}"]

[[target]]
id = "linux-arm64"
kind = "file"
group = "cli"
build = "cli"
os = "linux"
arch = "arm64"
output = "dist/release/stw_{version_number}_linux_arm64.tar.gz"
runner = "ubuntu-24.04-arm"
smoke_argv = ["sh", "scripts/release-smoke.sh", "{version}"]

[[target]]
id = "darwin-arm64"
kind = "file"
group = "cli"
build = "cli"
os = "darwin"
arch = "arm64"
output = "dist/release/stw_{version_number}_darwin_arm64.tar.gz"
runner = "macos-15"
smoke_argv = ["sh", "scripts/release-smoke.sh", "{version}"]

[outputs]
checksums = "SHA256SUMS"

[reproducibility]
policy = "required"
source_date_epoch = "commit-time"

[allowlist]
paths = ["docs/**", "README.md", "llms.txt"]

[ci]
workflows = ["ci.yml"]
release_workflow = ".github/workflows/release-build.yml"
